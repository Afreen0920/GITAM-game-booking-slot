<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GITAM Game Slot Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOGIN PAGE -->
  <div class="container" id="login-page">
    <h1>🎮 GITAM Game Slot Booking</h1>
    <div class="card">
      <label>Enter your GITAM email:</label>
      <input type="email" id="email" placeholder="yourname@gitam.in">
      <button id="login-btn">Login</button>
      <p class="admin-link">Admin? <a href="#" id="admin-access">Login here</a></p>
    </div>
  </div>

  <!-- MAIN PAGE -->
  <div class="container hidden" id="main-page">
    <h1>🎮 GITAM Game Slot Booking</h1>
    <p id="user-info"></p>
    <button id="logout-btn">Logout</button>

    <div class="card">
      <h2>Select a Game</h2>
      <div class="games">
        <button class="game-btn" data-game="Badminton">🏸 Badminton</button>
        <button class="game-btn" data-game="Table Tennis">🏓 Table Tennis</button>
        <button class="game-btn" data-game="Basketball">🏀 Basketball</button>
        <button class="game-btn" data-game="Volleyball">🏐 Volleyball</button>
      </div>
    </div>

    <!-- SLOTS SECTION -->
    <div class="card hidden" id="slots-card">
      <h3 id="slots-title"></h3>
      <div id="slots"></div>
      <button id="back-btn">← Back</button>
    </div>

    <!-- BOOKINGS SECTION -->
    <div class="card">
      <h2>My Bookings</h2>
      <p>⭐ Points: <span id="points">0</span></p>
      <p id="reward-status"></p>
      <ul id="my-bookings"></ul>
    </div>
  </div>

  <!-- ADMIN LOGIN -->
  <div class="container hidden" id="admin-login">
    <h1>🔐 Admin Login</h1>
    <div class="card">
      <input type="password" id="admin-pass" placeholder="Enter Admin Password">
      <button id="admin-login-btn">Login</button>
      <button id="admin-back-btn">Back</button>
    <-logo
  </div>

  <!-- ADMIN DASHBOARD -->
  <div class="container hidden" id="admin-page">
    <h1>📋 Admin Dashboard</h1>
    <button id="admin-logout">Logout</button>
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Game</th>
          <th>Date</th>
          <th>Time Slot</th>
        </tr>
      </thead>
      <tbody id="booking-table"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
